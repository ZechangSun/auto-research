[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-research"
version = "0.1.0"
description = "Auto-research pipeline scaffold for coding agents with memory, planning, and reflection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ZechangSun" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ts-dfm = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.2",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[project.scripts]
auto-research = "auto_research.cli:main"
reproduce-tsdfm = "reproductions.ts_dfm_2511_17229.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["auto_research*", "reproductions*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
